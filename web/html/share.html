<!DOCTYPE html>
<html>
<head>
    <title>文件分享提取</title>
    <meta charset="utf-8">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; box-sizing: border-box; }
        h2 { color: #1976D2; margin-top: 0; }
        .filename { font-size: 1.3em; color: #333; margin: 20px 0; word-break: break-all; font-weight: bold; }
        .info { color: #666; margin-bottom: 30px; font-size: 0.95em; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        .info p { margin: 5px 0; }
        input { width: 100%; box-sizing: border-box; padding: 15px; margin: 10px 0; border: 2px solid #e0e0e0; border-radius: 8px; text-align: center; letter-spacing: 4px; font-size: 1.2em; transition: border-color 0.3s; }
        input:focus { border-color: #2196F3; outline: none; }
        button { background: #2196F3; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 1.1em; width: 100%; transition: background 0.3s; font-weight: bold; }
        button:hover { background: #1976D2; }
        button:disabled { background: #bdbdbd; cursor: not-allowed; }
        #error-msg { color: #d32f2f; margin-top: 15px; display: none; font-size: 0.9em; background: #ffebee; padding: 10px; border-radius: 4px; }
        .loading-spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #f3f3f3; border-top: 3px solid #2196F3; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- 加载中状态 -->
    <div class="card" id="loading-card">
        <div class="loading-spinner"></div>
        <h3 style="color: #666; margin:0;">正在获取分享信息...</h3>
    </div>

    <!-- 主界面 -->
    <div class="card" id="main-card" style="display: none;">
        <h2>文件分享</h2>
        <div class="filename" id="file-name"></div>
        <div class="info">
            <p>分享者：<strong id="sharer-name"></strong></p>
            <p>文件大小：<strong id="file-size"></strong></p>
        </div>
        
        <!-- 提取码输入区 (仅加密分享显示) -->
        <div id="protected-area" style="display: none; margin-bottom: 20px;">
            <input type="text" id="extract-code" placeholder="请输入4位提取码" maxlength="4" autocomplete="off">
        </div>
        
        <button id="download-btn" onclick="verifyAndDownload()">下载文件</button>
        <div id="error-msg"></div>
    </div>

    <script>
        // 1. 从 URL 路径中提取 shareId (例如 /s/aB3x9Y -> aB3x9Y)
        const shareId = window.location.pathname.split('/').pop();
        let shareType = 'public';

        // 2. 页面加载时，向 Master 获取文件信息
        window.onload = async function() {
            try {
                const res = await fetch(`/share/info?share_id=${shareId}`);
                const result = await res.json();
                
                if (result.code !== 0) {
                    showFatalError(result.message || "分享链接无效或已过期");
                    return;
                }

                const data = result.data;
                shareType = data.shareType;
                
                // 渲染 UI
                document.getElementById('file-name').textContent = data.filename;
                document.getElementById('sharer-name').textContent = data.sharer;
                document.getElementById('file-size').textContent = formatSize(data.fileSize);
                
                if (shareType === 'protected') {
                    document.getElementById('protected-area').style.display = 'block';
                    document.getElementById('download-btn').textContent = '提取文件';
                }

                // 切换卡片显示
                document.getElementById('loading-card').style.display = 'none';
                document.getElementById('main-card').style.display = 'block';
            } catch (e) {
                showFatalError("网络错误，无法连接到服务器");
            }
        };

        // 3. 验证提取码并获取 DataNode 下载地址
        async function verifyAndDownload() {
            const btn = document.getElementById('download-btn');
            const errorMsg = document.getElementById('error-msg');
            let extractCode = '';

            // 如果是加密分享，校验输入
            if (shareType === 'protected') {
                extractCode = document.getElementById('extract-code').value.trim();
                if (extractCode.length !== 4) {
                    showError('请输入 4 位提取码');
                    return;
                }
            }

            // 锁定按钮，防止重复点击
            btn.disabled = true;
            btn.textContent = '正在获取下载地址...';
            errorMsg.style.display = 'none';

            try {
                // 向 Master 验证密码并换取 Token
                const res = await fetch('/api/share/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shareId: shareId, extractCode: extractCode })
                });
                const result = await res.json();

                if (result.code !== 0) {
                    showError(result.message);
                    btn.disabled = false;
                    btn.textContent = shareType === 'protected' ? '提取文件' : '下载文件';
                    return;
                }

                // 🌟 核心：拿到 DataNode 地址和专属 Token，直接触发浏览器下载！
                const downloadUrl = `${result.data.downloadUrl}?token=${result.data.token}`;
                
                btn.textContent = '开始下载...';
                
                // 创建一个隐藏的 a 标签触发下载
                const a = document.createElement('a');
                a.href = downloadUrl;
                // 注意：跨域情况下 a.download 可能失效，主要靠后端的 Content-Disposition 头来指定文件名
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                // 3秒后恢复按钮状态
                setTimeout(() => { 
                    btn.disabled = false; 
                    btn.textContent = shareType === 'protected' ? '提取文件' : '下载文件';
                }, 3000);

            } catch (e) {
                showError('网络错误，请稍后重试');
                btn.disabled = false;
                btn.textContent = shareType === 'protected' ? '提取文件' : '下载文件';
            }
        }

        // 辅助函数：格式化文件大小
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 辅助函数：显示普通错误
        function showError(msg) {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }

        // 辅助函数：显示致命错误（如链接失效）
        function showFatalError(msg) {
            const card = document.getElementById('loading-card');
            card.innerHTML = `
                <div style="font-size: 40px; color: #f44336; margin-bottom: 15px;">⚠️</div>
                <h3 style="color: #333; margin:0;">${msg}</h3>
                <p style="color: #666; margin-top: 15px; font-size: 0.9em;">请检查链接是否正确，或联系分享者重新分享。</p>
            `;
        }
    </script>
</body>
</html>
