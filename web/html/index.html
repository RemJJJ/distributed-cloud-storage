    <script>
    // 添加 AbortController 用于控制视频连接
    let videoAbortController = null;

    // 会话管理
    let token = localStorage.getItem('token');
    let currentUser = localStorage.getItem('username');

    function downloadFile(filename, originalName) {
        if (!token) {
            alert('请先登录');
            return;
        }

        fetch(`/download/${encodeURIComponent(filename)}`, {
            headers: {
                'Authorization': 'Bearer ' + token
            }
        })
        .then(res => res.json())
        .then(result => {
            if (result.code !== 0) throw new Error(result.message);

            const downloadUrl = `${result.data.downloadUrl}?token=${result.data.token}`;

            // ✅ 直接让浏览器下载（关键）
            window.location.href = downloadUrl;
        })
        .catch(err => {
            alert('下载失败: ' + err.message);
        });
    }

    // 检查登录状态
    function checkLoginStatus() {
        if (token && currentUser) {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('username-display').textContent = currentUser;
            loadFileList();
            console.log("加载完上传文件列表");
            loadSharedWithMeList();
            console.log("加载完分享文件列表");
            loadRecycleBin();
            console.log("加载完回收站文件列表");
        } else {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');
            document.getElementById('user-info').classList.add('hidden');
        }
    }

    // 登录函数
    function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        // 重置错误提示
        document.getElementById('username-error').style.display = 'none';
        document.getElementById('password-error').style.display = 'none';

        // 表单验证
        let hasError = false;
        if (!username) {
            document.getElementById('username-error').textContent = '请输入用户名';
            document.getElementById('username-error').style.display = 'block';
            hasError = true;
        }
        if (!password) {
            document.getElementById('password-error').textContent = '请输入密码';
            document.getElementById('password-error').style.display = 'block';
            hasError = true;
        }
        
        if (hasError) {
            return;
        }

        fetch('/login', {

    // 辅助函数：分块计算大文件 MD5
    function calculateMD5(file, onProgress) {
    return new Promise((resolve, reject) => {
        const chunkSize = 2 * 1024 * 1024; // 每次读取 2MB
        const chunks = Math.ceil(file.size / chunkSize);
        let currentChunk = 0;
        const spark = new SparkMD5.ArrayBuffer();
        const fileReader = new FileReader();

        fileReader.onload = function (e) {
            spark.append(e.target.result); // 追加数据
            currentChunk++;
            
            if (onProgress) {
                onProgress(Math.round((currentChunk / chunks) * 100));
            }

            if (currentChunk < chunks) {
                loadNext();
            } else {
                resolve(spark.end()); // 完成计算，返回 MD5 字符串
            }
        };

        fileReader.onerror = function () {
            reject('文件读取失败');
        };

        function loadNext() {
            const start = currentChunk * chunkSize;
            const end = ((start + chunkSize) >= file.size) ? file.size : start + chunkSize;
            fileReader.readAsArrayBuffer(file.slice(start, end));
        }

        loadNext();
    });
}

    async function uploadFile() {
    const userToken = localStorage.getItem('token'); // 获取用户登录 Token
    if (!userToken) {
        alert('请先登录');
        return;
    }

    const fileInput = document.getElementById('file-input');
    const file = fileInput.files[0];
    if (!file) {
        alert('请选择文件');
        return;
    }

    const progress = document.querySelector('.progress');
    const progressBar = document.querySelector('.progress-bar');
    progress.style.display = 'block';
    
    try {
        // 计算文件MD5
        progressBar.textContent = '正在扫描文件 (计算MD5)...';
        progressBar.style.width = '10%';
        
        const fileMd5 = await calculateMD5(file, (percent) => {
            // 扫描进度 (只占前 10% 的进度条视觉效果)
            progressBar.style.width = (percent * 0.1) + '%'; 
        });

        // ==========================================
        // 第一阶段：向 Master 申请上传地址
        // ==========================================
        progressBar.textContent = '正在请求服务器...';

        const requestResponse = await fetch('/upload', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + userToken // 验证用户身份
            },
            body: JSON.stringify({
                original_filename: file.name,
                file_size: file.size,
                file_type: file.type || 'application/octet-stream',
                md5: fileMd5
            })
        });

        const requestData = await requestResponse.json();

        if(requestData.code ===1){
            progressBar.style.width = '100%';
            progressBar.textContent = '秒传成功！';
            progressBar.style.backgroundColor = '#4CAF50';
            alert('极速秒传成功！');
            loadFileList();
            setTimeout(() => { progress.style.display = 'none'; }, 1500);
            return; // 直接结束，不需要走 DataNode 了！
        }
        
        if (requestData.code !== 0) {
            throw new Error(requestData.message || '获取上传地址失败');
        }

        // 拿到 Master 分配的 DataNode 地址和专属上传 Token
        const uploadUrl = requestData.data.uploadUrl;
        const uploadToken = requestData.data.uploadToken;

        // ==========================================
        // 第二阶段：向 DataNode 真正上传文件
        // ==========================================
        progressBar.textContent = '正在上传...';
        
        const xhr = new XMLHttpRequest();
        xhr.open('POST', uploadUrl, true); // 注意：这里用的是 Master 返回的动态 URL！

        xhr.timout = 5000;

        xhr.ontimeout = function(){
            console.error("连接存储节点超时！");
            alert("存储节点暂时无响应，请稍后重试。");
            progress.style.display = 'none';
            progressBar.style.width = '0%';
        };
        
        // ⚠️ 极其重要：这里带的是 Master 刚刚签发的专属 uploadToken，而不是用户的登录 Token！
        xhr.setRequestHeader('Authorization', 'Bearer ' + uploadToken); 
        // 如果你的 DataNode 还需要原文件名，可以保留这个头，否则可以删掉
        xhr.setRequestHeader('X-File-Name', encodeURIComponent(file.name));
        xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

        // 监听上传进度
        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const percentComplete = 10 + Math.round((e.loaded / e.total) * 90);
                progressBar.style.width = percentComplete + '%';
                progressBar.textContent = percentComplete + '%';
            }
        };

        // 监听上传完成
        xhr.onload = function() {
            if (xhr.status === 200) {
                alert('上传成功');
                loadFileList(); // 刷新文件列表
            } else {
                try {
                    const response = JSON.parse(xhr.responseText);
                    alert('上传失败: ' + (response.message || xhr.statusText));
                } catch (e) {
                    alert('上传失败: 服务器返回异常状态 ' + xhr.status);
                }
            }
            // 恢复 UI 状态
            setTimeout(() => {
                progress.style.display = 'none';
                progressBar.style.width = '0%';
                progressBar.textContent = '';
                fileInput.value = '';  // 清空文件选择
            }, 1000);
        };

        // 监听网络错误
        xhr.onerror = function() {
            alert('网络错误，无法连接到存储节点！');
            progress.style.display = 'none';
        };

        xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
        xhr.send(file); // 浏览器会自动将文件以纯二进制流形式发出

    } catch (error) {
        alert('操作失败: ' + error.message);
        progress.style.display = 'none';
        progressBar.style.width = '0%';
    }
}

    function formatSize(bytes) {
        const units = ['B', 'KB', 'MB', 'GB'];
        let size = bytes;
        let unitIndex = 0;
        while (size >= 1024 && unitIndex < units.length - 1) {
            size /= 1024;
            unitIndex++;
        }
        return size.toFixed(2) + ' ' + units[unitIndex];
    }

    async function playVideo(filename) {
        const token = localStorage.getItem('token'); // 确保获取到 token
        if (!token) {
            alert('请先登录');
            return;
        }

        try{
            const url = `/download/${encodeURIComponent(filename)}`;
            
            const res = await fetch(url, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const result = await res.json();
            if (result.code !== 0) throw new Error(result.message);
            // 构造真正的 DataNode 播放 URL
            const videoUrl = `${result.data.downloadUrl}?token=${result.data.token}`;
            

            const videoPlayer = document.getElementById('video-player');
            const videoElement = document.getElementById('video-element');
            const overlay = document.getElementById('overlay');
            const closeButton = document.getElementById('video-close-button');
            
            // 显示播放器和遮罩层
            videoPlayer.style.display = 'block';
            overlay.style.display = 'block';
            
            // 设置视频属性
            videoElement.preload = 'metadata'; // 只预加载元数据
            videoElement.autoplay = true;

            // 处理DataNode宕机连不上的情况
            videoElement.onerror = function(){
                console.error('视频加载失败，存储节点可能已离线');
                alert('视频加载失败：存储节点暂时无响应，请稍后重试。');
                closeVideo();
            };
            
            // 添加元数据加载完成事件
            videoElement.addEventListener('loadedmetadata', function() {
                console.log('视频元数据已加载，时长:', videoElement.duration);
                
                // 保存原始视频URL和时长信息
                const originalSrc = videoElement.src;
                videoElement.dataset.originalSrc = originalSrc;
                videoElement.dataset.duration = videoElement.duration;
                
                // 设置目标缓冲时间（秒）
                const targetBufferTime = 5; // 目标缓冲5秒钟的数据
                const minBufferPercent = 0.1; // 或者至少缓冲视频总时长的10%
                const minBufferSeconds = Math.min(targetBufferTime, videoElement.duration * minBufferPercent);
                
                console.log(`元数据已加载，开始缓冲初始数据(目标: ${minBufferSeconds.toFixed(2)}秒)...`);
                
                // 设置缓冲检查定时器
                const bufferCheckInterval = setInterval(() => {
                    // 如果用户已经开始播放，不中断连接
                    if (videoElement.hasAttribute('data-played')) {
                        clearInterval(bufferCheckInterval);
                        return;
                    }
                    
                    // 检查缓冲进度
                    if (videoElement.buffered.length > 0) {
                        const bufferedEnd = videoElement.buffered.end(0);
                        console.log(`当前已缓冲: ${bufferedEnd.toFixed(2)}秒`);
                        
                        // 如果已经缓冲了足够的数据，中断连接
                        if (bufferedEnd >= minBufferSeconds) {
                            clearInterval(bufferCheckInterval);
                            console.log(`已缓冲足够数据(${bufferedEnd.toFixed(2)}秒)，中断初始连接`);
                            
                            videoElement.pause();
                            videoElement.removeAttribute('src');
                            videoElement.load(); // 终止网络请求
                        }
                    }
                }, 500); // 每500ms检查一次缓冲状态
                
                // 设置最大等待时间，避免无限等待
                setTimeout(() => {
                    if (!videoElement.hasAttribute('data-played')) {
                        clearInterval(bufferCheckInterval);
                        
                        // 即使没有达到理想的缓冲量，也进行检查
                        if (videoElement.buffered.length > 0) {
                            const bufferedEnd = videoElement.buffered.end(0);
                            console.log(`达到最大等待时间，当前已缓冲: ${bufferedEnd.toFixed(2)}秒`);
                            
                            // 如果至少有1秒的数据，仍然中断连接
                            if (bufferedEnd >= 1) {
                                console.log(`虽未达到目标缓冲量，但已有${bufferedEnd.toFixed(2)}秒数据，中断连接`);
                                videoElement.pause();
                                videoElement.removeAttribute('src');
                                videoElement.load();
                            } else {
                                console.log(`缓冲量不足(${bufferedEnd.toFixed(2)}秒)，继续保持连接`);
                            }
                        } else {
                            console.log('缓冲异常，未检测到有效缓冲区');
                        }
                    }
                }, 10000); // 最多等待10秒
            });
            
            // 添加播放事件，确保视频播放时源已设置
            videoElement.addEventListener('play', function onFirstPlay() {
                // 标记视频已经开始播放
                videoElement.setAttribute('data-played', 'true');
                
                // 仅在首次播放时执行
                if (!videoElement.hasAttribute('data-playing')) {
                    console.log('首次播放，重新加载视频源');
                    videoElement.setAttribute('data-playing', 'true');
                    
                    // 如果视频源不存在，但有保存的原始源，重新加载源
                    if (!videoElement.src && videoElement.dataset.originalSrc) {
                        videoElement.src = videoElement.dataset.originalSrc;
                    }
                }
            });
            
            // 添加seeking事件，确保拖动进度条时能正常工作
            videoElement.addEventListener('seeking', function() {
                console.log('seeking to:', videoElement.currentTime);
                
                // 确保视频源已加载
                if (!videoElement.src && videoElement.dataset.originalSrc) {
                    console.log('拖动进度条时检测到视频源未加载，重新加载源');
                    videoElement.src = videoElement.dataset.originalSrc;
                    videoElement.setAttribute('data-played', 'true');
                }
            });
            
            // 设置视频源，这将开始加载元数据
            videoElement.src = videoUrl;
            
            // 设置关闭按钮事件
            closeButton.onclick = function() {
                closeVideo();
            };
            
            // 点击遮罩层也可关闭视频
            overlay.onclick = function() {
                closeVideo();
            };
            
            // 添加ESC键关闭功能
            const escHandler = function(event) {
                if (event.key === 'Escape') {
                    closeVideo();
                }
            };
            document.addEventListener('keydown', escHandler);
            
            // 清理函数
            videoElement.cleanup = function() {
                document.removeEventListener('keydown', escHandler);
                
                // 清理所有数据
                delete videoElement.dataset.originalSrc;
                delete videoElement.dataset.duration;
                delete videoElement.dataset.played;

                // 清理onerror时间
                videoElement.onerror = null;
            };
        }catch (err){
            alert("无法播放视频: " + err.message);
        }
    }

    async function previewImage(filename, originalName) {
        const token = localStorage.getItem('token')
        if (!token) {
            alert('请先登录');
            return;
        }

        const imagePreview = document.getElementById('image-preview');
        const previewImage = document.getElementById('preview-image');
        const overlay = document.getElementById('overlay');

            // 向Master请求下载地址
            const requestUrl = `/download/${encodeURIComponent(filename)}`;

            const res = await fetch(requestUrl, {
                headers: {'Authorization': 'Bearer '+ token}
            });

            if(res.status === 404)throw new Error("接口不存在，请检查Master路由");

            const result = await res.json();
            if(result.code != 0)throw new Error(result.message);
            const downloadUrl = `${result.data.downloadUrl}?token=${result.data.token}`;
            previewImage.src = '';
            previewImage.alt = '正在加载图片...';

            // 显示预览区域和遮罩层
            imagePreview.style.display = 'block';
            overlay.style.display = 'block';

            const imgRes = await fetch(downloadUrl);
            if (!imgRes.ok) throw new Error("从存储节点获取图片失败");
            
            const blob = await imgRes.blob();
            
            // 生成本地预览 URL 并赋值给 img 标签
            const imageUrl = URL.createObjectURL(blob);
            previewImage.src = imageUrl;
            previewImage.alt = originalName;

             // 内存泄漏防护：当图片加载完成后，释放 Blob URL
            previewImage.onload = function() {
                URL.revokeObjectURL(imageUrl);
            };

            // 事件绑定：Esc 键关闭
            const escHandler = function(event) {
                if (event.key === 'Escape') {
                    closeImagePreview();
                }
            };
            document.addEventListener('keydown', escHandler);
            
            // 事件绑定：点击遮罩层关闭
            overlay.onclick = closeImagePreview;
            
            // 保存事件监听器引用以便后续移除
            window.currentEscHandler = escHandler;
        }catch(error){
            console.error('图片预览失败:', error);
            alert('预览失败: ' + error.message);
            closeImagePreview(); // 失败时自动关闭预览框
        }
    }

    // 添加页面可见性变化事件处理
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            closeVideo();
        }
    });

    // 添加回车键登录支持
    document.getElementById('username').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('password').focus();
        }
    });

    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            login();
        }
    });

    // 当前要分享的文件信息
    let currentShareFile = null;
    let selectedUserId = null;

    // 打开分享对话框
    function openShareDialog(file) {
        currentShareFile = file;
        document.querySelector('.share-dialog').style.display = 'block';
        document.querySelector('.overlay').style.display = 'block';
        document.querySelector('.share-info').style.display = 'none';
        document.querySelector('.share-options').style.display = 'block';
        resetShareForm();
    }

    // 关闭分享对话框
    function closeShareDialog() {
        document.querySelector('.share-dialog').style.display = 'none';
        document.querySelector('.overlay').style.display = 'none';
        const btnContainer = document.getElementById('dialogButtonsContainer');
        if(btnContainer){
            btnContainer.style.display = 'flex';
        }
        currentShareFile = null;
        selectedUserId = null;
    }

    // 重置分享表单
    function resetShareForm() {
        document.querySelector('input[value="public"]').checked = true;
        document.querySelector('.user-search').style.display = 'none';
        document.querySelector('.expire-time').style.display = 'none';
        document.querySelector('.user-search input').value = '';
        document.querySelector('.user-list').innerHTML = '';
        document.querySelector('.expire-time select').value = '0';
    }

    // 处理分享类型变化
    document.querySelectorAll('input[name="shareType"]').forEach(radio => {
        radio.addEventListener('change', function() {
            const userSearch = document.querySelector('.user-search');
            const expireTime = document.querySelector('.expire-time');
            
            // 对于其他分享类型
            userSearch.style.display = this.value === 'specific' ? 'block' : 'none';
            expireTime.style.display = 'block';
            
            if (this.value === 'specific') {
                document.querySelector('#userSearchInput').focus();
            }
        });
    });

    // 搜索用户
    let searchTimeout = null;
    document.querySelector('#userSearchInput').addEventListener('input', function() {
        clearTimeout(searchTimeout);
        const searchTerm = this.value.trim();
        
        if (searchTerm.length < 2) {
            document.querySelector('.user-list').innerHTML = '';
            return;
        }
        
        searchTimeout = setTimeout(() => {
            console.log(searchTerm);
            searchUsers(searchTerm);
        }, 300);
    });

    async function searchUsers(keyword) {
        try {
            const response = await fetch(`/users/search?keyword=${encodeURIComponent(keyword)}`, {
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token')// 验证用户身份
                }
            });
            
            const data = await response.json();
            if (data.code === 0) {
                displayUsers(data.users);
            } else {
                console.error('搜索用户失败:', data.message);
            }
        } catch (error) {
            console.error('搜索用户出错:', error);
        }
    }

    function displayUsers(users) {
        const userList = document.querySelector('.user-list');
        userList.innerHTML = '';
        
        users.forEach(user => {
            const userItem = document.createElement('div');
            userItem.className = 'user-item';
            userItem.textContent = user.username;
            userItem.onclick = () => selectUser(user);
            userList.appendChild(userItem);
        });
    }

    function selectUser(user) {
        selectedUserId = user.id;
        document.querySelector('#userSearchInput').value = user.username;
        document.querySelector('.user-list').innerHTML = '';
    }

    // 修改分享文件函数
    async function shareFile() {
        if (!currentShareFile) return;

        const token = localStorage.getItem('token');
        if(!token){
            alert('请先登录');
            return;
        }
        
        const shareType = document.querySelector('input[name="shareType"]:checked').value;  
        if (shareType === 'private') return;

        const expireSelect = document.querySelector('.expire-time select');
        const expireHours = expireSelect? parseInt(expireSelect.value):0;
        
        const shareData = {
            fileId: currentShareFile.id,
            shareType: shareType,
            expireTime: expireHours || 0
        };
        
        console.log(shareType);

        if (shareType === 'specific') {
            if (!selectedUserId) {
                alert('请先搜索并选择要分享的用户！');
                return;
            }
            shareData.sharedWithId = parseInt(selectedUserId);
        }

        console.log(selectedUserId);
        
        try {
            const response = await fetch('/share', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer '+token
                },
                body: JSON.stringify(shareData)
            });
            
            const result = await response.json();
            
            if (result.code === 0) {
                // 显示分享信息
                const responseData = result.data;
                const btnContainer = document.getElementById('dialogButtonsContainer');
                if(btnContainer){
                    btnContainer.style.display = 'none';
                }
                document.querySelector('.share-options').style.display = 'none';
                document.querySelector('.share-info').style.display = 'block';
                
                // 🌟 修改 4：根据分享类型展示不同的 UI
                if (shareType === 'specific') {
                    // 定向分享没有链接，直接提示成功
                    showMessage('已成功发送给指定用户！对方可在"与我共享"中查看。', 'success');
                    closeShareDialog();
                } else {
                    // 公开或加密分享，前端动态拼接完整的分享链接 (适配任何域名/端口)
                    const shareLink = `${window.location.origin}/s/${responseData.shareId}`;
                    document.querySelector('#shareLink').textContent = shareLink;
                    
                    // 如果有提取码，展示提取码
                    if (responseData.extractCode) {
                        document.querySelector('#extractCode').textContent = responseData.extractCode;
                        extractCodeContainer.style.display = 'block';
                    } else {
                        extractCodeContainer.style.display = 'none';
                    }
                }
                loadFileList();
            } else {
                showMessage(result.message, 'error');
            }
        } catch (error) {
            console.error('分享文件出错:', error);
            showMessage('分享文件失败，请稍后重试', 'error');
        }
    }

    function switchTab(tabId) {

        document.getElementById('file-list').style.display = tabId === 'my-files' ? 'block' : 'none';
        document.getElementById('file-list-title').style.display= tabId === 'my-files' ? 'block' : 'none';

        document.getElementById('shared-with-me-section').style.display = tabId === 'shared-with-me' ? 'block' : 'none';

        document.getElementById('recycle-bin-section').style.display = tabId === 'recycle-bin' ? 'block' : 'none';
        // 处理按钮高亮
        updateActiveButton(tabId);
    }


    function updateActiveButton(tabId){
        const myBtn = document.getElementById('btn-my-files');
        const sharedBtn = document.getElementById('btn-shared');
        const recycleBtn = document.getElementById('btn-recycle-bin');

        myBtn.classList.remove('active');
        sharedBtn.classList.remove('active');
        recycleBtn.classList.remove('active');

        if (tabId === 'my-files') {
            myBtn.classList.add('active');
        } else if(tabId === 'shared-with-me'){
            sharedBtn.classList.add('active');
        }else{
            recycleBtn.classList.add('active');
        }
    }
    //加载与我共享列表
    async function loadSharedWithMeList() {
        try {
            const res = await fetch('/share/received', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const result = await res.json();
            const listDiv = document.getElementById('shared-list');
            listDiv.innerHTML = '';
            
            result.data.forEach(file => {
                listDiv.innerHTML += `
                    <div class="file-item">
                        <div class="file-header">
                            <span class="file-name">${file.originalName}</span>
                            <button class="action-button download-button" onclick="downloadFile('${file.filename}', '${file.originalName}')">
                                <i class="fas fa-download"></i> 下载
                            </button>
                        </div>
                        <div class="file-info">
                            <span>分享者: ${file.sharerName}</span>
                            <span>大小: ${formatSize(file.size)}</span>
                            <span>时间: ${file.shareTime}</span>
                        </div>
                    </div>
                `;
            });
        } catch (e) { console.error(e); }
    }

    // 加载回收站列表
    async function loadRecycleBin(){
        try{
            const res = await fetch('/recycle_bin', {
                headers: {
                    'Authorization': 'Bearer '+token
                }
            })
            const result = await res.json();
            const listDiv = document.getElementById('recycle-list');
            listDiv.innerHTML = '';

            if(result.data.length === 0){
                return;
            }

            result.data.forEach(file=>{
                listDiv.innerHTML = `
                    <div class="file-item" style="border-left: 4px solid #f44336;">
                        <div class="file-header">
                            <span class="file-name" style="color: #666; text-decoration: line-through;">${file.originalName}</span>
                            <div class="file-actions">
                                <button class="action-button preview-button" onclick="restoreFile(${file.id})">
                                    <i class="fas fa-undo"></i> 恢复
                                </button>
                                <button class="action-button delete-button" onclick="hardDeleteFile(${file.id})">
                                    <i class="fas fa-trash-alt"></i> 彻底删除
                                </button>
                            </div>
                        </div>
                        <div class="file-info">
                            <span>大小: ${formatSize(file.size)}</span>
                            <span style="color: #f44336;">删除时间: ${file.deletedAt}</span>
                        </div>
                    </div>
                `;
            });
        }catch(error){
            console.error(e);
        }
    }

    // 恢复文件
    async function restoreFile(fileId){
        if(!confirm("确定恢复这个文件吗？"))return;
        try{
            const res = await fetch('/restore',{
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
                body: JSON.stringify({fileId: fileId})
            });
            const data = await res.json();
            if(data.code === 0){
                showMessage('文件已恢复', 'success');
                loadRecycleBin();
                loadFileList();
            }else{
                showMessage(data.message, 'error');
            }
        }catch(error){
            showMessage('恢复失败', 'error');
        }
    }

    // 彻底删除
    async function hardDeleteFile(fileId){
        if(!confirm('彻底删除后将无法恢复，确定要删除吗？'))return;

        try {
            const res = await fetch('/hard_delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ fileId: fileId })
            });
            const data = await res.json();
            if (data.code === 0) {
                showMessage('已彻底删除', 'success');
                loadRecycleBin();
            } else {
                showMessage(data.message, 'error');
            }
        } catch (e) { showMessage('删除失败', 'error'); }
    }
    

    // 一键复制所有分享信息
    function copyAllShareInfo() {
        const link = document.querySelector('#shareLink').textContent;
        const extractCodeContainer = document.querySelector('#extractCodeContainer');
        
        let copyText = '';
        
        // 如果是定向分享，其实没有链接，直接提示
        if (link.includes('已成功发送')) {
            closeShareDialog();
            return;
        }

        // 智能拼接复制文本
        if (extractCodeContainer.style.display !== 'none') {
            const code = document.querySelector('#extractCode').textContent;
            copyText = `分享链接：${link}\n提取码: ${code}\n`;
        } else {
            copyText = `分享链接：${link}\n`;
        }
        
        // 执行复制
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(copyText).then(() => {
                showMessage('复制成功，快去分享给好友吧！', 'success');
                // 复制成功后可以自动关闭，也可以不关闭，看你喜好。这里选择不自动关闭，让用户自己点关闭。
            }).catch(err => {
                fallbackCopyText(copyText);
            });
        } else {
            fallbackCopyText(copyText);
        }
    }

     // 传统复制方法
     function fallbackCopyText(text) {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        textArea.style.top = '0';
        
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        
        try {
            const successful = document.execCommand('copy');
            if (successful) {
                showMessage('复制成功，快去分享给好友吧！', 'success');
            } else {
                showMessage('复制失败，请手动选中复制', 'error');
            }
        } catch (err) {
            showMessage('复制失败，请手动选中复制', 'error');
        }
        
        document.body.removeChild(textArea);
    }

    // 显示消息提示
    function showMessage(message, type) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type}`;
        messageDiv.innerHTML = `
            <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
            <span>${message}</span>
        `;
        
        document.body.appendChild(messageDiv);
        
        setTimeout(() => {
            messageDiv.classList.add('show');
        }, 10);
        
        setTimeout(() => {
            messageDiv.classList.remove('show');
            setTimeout(() => {
                document.body.removeChild(messageDiv);
            }, 300);
        }, 3000);
    }

    // 获取分享类型的中文描述
    function getShareTypeText(shareType) {
        const types = {
            'public': '完全公开',
            'protected': '需要提取码',
            'specific': '指定用户'
        };
        return types[shareType] || shareType;
    }

    // 添加取消分享函数
    async function cancelShare(fileId) {
        try {
            const response = await fetch('/share/cancel', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ fileId: fileId })
                });
            
            const data = await response.json();
            if (data.code === 0) {
                showMessage('已取消分享', 'success');
                loadFileList();
            } else {
                showMessage(data.message, 'error');
            }
        } catch (error) {
            console.error('取消分享失败:', error);
            showMessage('取消分享失败，请稍后重试', 'error');
        }
    }

    // 复制文本内容
    function copyText(elementId) {
        const text = document.getElementById(elementId).textContent;
        
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => {
                showMessage('复制成功', 'success');
            }).catch(err => {
                fallbackCopyText(text);
            });
        } else {
            fallbackCopyText(text);
        }
    }

    // 传统复制方法
    function fallbackCopyText(text) {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        textArea.style.top = '0';
        
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        
        try {
            const successful = document.execCommand('copy');
            if (successful) {
                showMessage('复制成功', 'success');
            } else {
                showMessage('复制失败，请手动复制', 'error');
            }
        } catch (err) {
            console.error('复制失败:', err);
            showMessage('复制失败，请手动复制', 'error');
        }
        
        document.body.removeChild(textArea);
    }

    // 页面加载时检查登录状态
    checkLoginStatus();
    </script>
